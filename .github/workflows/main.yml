name: Compilar Widget Pixel 6 Pro V3.5 (Fix Solapamiento Botonera con Luna Completa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generar Estructura Nativa v3.5
      run: |
        mkdir -p app/src/main/java/com/alex/pixelglancewidget
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        
        echo "android.useAndroidX=true" > gradle.properties
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "pixel-glance-app"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.1.1" apply false
            id("org.jetbrains.kotlin.android") version "1.8.10" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.alex.pixelglancewidget"
            compileSdk = 34
            
            defaultConfig {
                applicationId = "com.alex.pixelglancewidget"
                minSdk = 26
                targetSdk = 34
                versionCode = 35
                versionName = "3.5"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_CALENDAR" />
            <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.INTERNET" />
            
            <application android:label="Eventos XL" android:theme="@android:style/Theme.DeviceDefault.DayNight">
                <receiver android:name=".GlanceWidgetProvider" android:exported="true">
                    <intent-filter>
                        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                        <action android:name="com.alex.pixelglancewidget.FORCE_REFRESH" />
                        <action android:name="com.alex.pixelglancewidget.TOGGLE_VIEW" />
                    </intent-filter>
                    <meta-data android:name="android.appwidget.provider" android:resource="@xml/glance_widget_info" />
                </receiver>
                <activity android:name=".WidgetConfigActivity" android:exported="true" android:theme="@android:style/Theme.DeviceDefault.DayNight">
                    <intent-filter>
                        <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                        <action android:name="com.alex.pixelglancewidget.EDIT_CONFIG" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_dark_glass.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#B3000000" />
            <corners android:radius="24dp" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_dynamic.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="?android:attr/colorBackgroundFloating" />
            <corners android:radius="24dp" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="24dp" android:gravity="center">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="Configuración del Widget" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="16dp"/>
            <RadioGroup android:id="@+id/rg_background" android:layout_width="match_parent" android:layout_height="wrap_content">
                <RadioButton android:id="@+id/rb_dark" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Cristal Oscuro (Recomendado)" android:checked="true"/>
                <RadioButton android:id="@+id/rb_trans" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Totalmente Transparente"/>
                <RadioButton android:id="@+id/rb_dyn" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Dinámico (Material You)"/>
            </RadioGroup>
            <Button android:id="@+id/btn_save" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Guardar Cambios" android:layout_marginTop="24dp"/>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/widget_layout.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/widget_container"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:padding="14dp">
            
            <LinearLayout
                android:id="@+id/action_buttons"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_alignParentTop="true"
                android:layout_alignParentRight="true"
                android:orientation="horizontal">
                
                <TextView
                    android:id="@+id/btn_settings"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="⚙️"
                    android:textSize="18sp"
                    android:paddingEnd="12dp"
                    android:background="?android:selectableItemBackground" />
                    
                <TextView
                    android:id="@+id/btn_refresh"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="🔄"
                    android:textSize="18sp"
                    android:paddingEnd="12dp"
                    android:background="?android:selectableItemBackground" />

                <TextView
                    android:id="@+id/btn_toggle"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="➡️"
                    android:textSize="18sp"
                    android:background="?android:selectableItemBackground" />
            </LinearLayout>

            <TextView
                android:id="@+id/widget_weather_main"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_alignParentTop="true"
                android:layout_alignParentLeft="true"
                android:layout_toLeftOf="@id/action_buttons"
                android:text="🌙 Cargando clima..."
                android:textColor="@android:color/white"
                android:textSize="13sp"
                android:maxLines="1"
                android:ellipsize="end"
                android:background="?android:selectableItemBackground" />

            <TextView
                android:id="@+id/widget_weather_sub"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_below="@id/widget_weather_main"
                android:layout_alignParentLeft="true"
                android:layout_toLeftOf="@id/action_buttons"
                android:text="⬇️ • AQI: ..."
                android:textColor="#E0E0E0"
                android:textSize="12sp"
                android:maxLines="1"
                android:ellipsize="end"
                android:layout_marginTop="2dp"
                android:background="?android:selectableItemBackground" />

            <TextView
                android:id="@+id/widget_title"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_below="@id/widget_weather_sub"
                android:layout_alignParentLeft="true"
                android:text="Próximos Eventos (2h):"
                android:textColor="@android:color/white"
                android:textSize="15sp"
                android:textStyle="bold"
                android:layout_marginTop="6dp"
                android:maxLines="1"
                android:ellipsize="end" />
                
            <TextView
                android:id="@+id/widget_event"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_below="@id/widget_title"
                android:text="Cargando..."
                android:textColor="@android:color/white"
                android:textSize="14sp"
                android:layout_marginTop="4dp"
                android:lineSpacingExtra="4dp" />
        </RelativeLayout>
        EOF

        cat << 'EOF' > app/src/main/res/xml/glance_widget_info.xml
        <?xml version="1.0" encoding="utf-8"?>
        <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
            android:minWidth="110dp"
            android:minHeight="100dp"
            android:updatePeriodMillis="1800000"
            android:initialLayout="@layout/widget_layout"
            android:configure="com.alex.pixelglancewidget.WidgetConfigActivity"
            android:resizeMode="horizontal|vertical"
            android:widgetCategory="home_screen" />
        EOF

        cat << 'EOF' > app/src/main/java/com/alex/pixelglancewidget/WidgetConfigActivity.kt
        package com.alex.pixelglancewidget
        import android.app.Activity
        import android.appwidget.AppWidgetManager
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.os.Bundle
        import android.widget.Button
        import android.widget.RadioGroup

        class WidgetConfigActivity : Activity() {
            private var widgetId = AppWidgetManager.INVALID_APPWIDGET_ID
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_config)
                
                widgetId = intent?.extras?.getInt(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID) ?: AppWidgetManager.INVALID_APPWIDGET_ID
                if (widgetId == AppWidgetManager.INVALID_APPWIDGET_ID) { finish(); return }

                val prefs = getSharedPreferences("widget_prefs", Context.MODE_PRIVATE)
                val currentBg = prefs.getInt("bg_choice_$widgetId", 0)
                if (currentBg == 1) findViewById<android.widget.RadioButton>(R.id.rb_trans).isChecked = true
                else if (currentBg == 2) findViewById<android.widget.RadioButton>(R.id.rb_dyn).isChecked = true
                else findViewById<android.widget.RadioButton>(R.id.rb_dark).isChecked = true
                
                findViewById<Button>(R.id.btn_save).setOnClickListener {
                    val permissionsNeeded = mutableListOf<String>()
                    if (checkSelfPermission(android.Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                        permissionsNeeded.add(android.Manifest.permission.READ_CALENDAR)
                    }
                    if (checkSelfPermission(android.Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                        permissionsNeeded.add(android.Manifest.permission.ACCESS_COARSE_LOCATION)
                        permissionsNeeded.add(android.Manifest.permission.ACCESS_FINE_LOCATION)
                    }
                    
                    if (permissionsNeeded.isNotEmpty()) {
                        requestPermissions(permissionsNeeded.toTypedArray(), 1)
                    } else {
                        saveAndComplete()
                    }
                }
            }
            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                saveAndComplete()
            }
            private fun saveAndComplete() {
                val rg = findViewById<RadioGroup>(R.id.rg_background)
                val bgChoice = when (rg.checkedRadioButtonId) {
                    R.id.rb_trans -> 1
                    R.id.rb_dyn -> 2
                    else -> 0
                }
                getSharedPreferences("widget_prefs", Context.MODE_PRIVATE).edit().putInt("bg_choice_$widgetId", bgChoice).apply()
                
                val intent = Intent(this, GlanceWidgetProvider::class.java).apply {
                    action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                    putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, intArrayOf(widgetId))
                }
                sendBroadcast(intent)
                
                val resultValue = Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId)
                setResult(RESULT_OK, resultValue)
                finish()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/alex/pixelglancewidget/GlanceWidgetProvider.kt
        package com.alex.pixelglancewidget
        import android.app.AlarmManager
        import android.app.PendingIntent
        import android.appwidget.AppWidgetManager
        import android.appwidget.AppWidgetProvider
        import android.content.ContentUris
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.location.Geocoder
        import android.location.LocationManager
        import android.net.Uri
        import android.provider.CalendarContract
        import android.text.Html
        import android.view.View
        import android.widget.RemoteViews
        import org.json.JSONObject
        import java.io.BufferedReader
        import java.io.InputStreamReader
        import java.net.HttpURLConnection
        import java.net.URL
        import java.text.SimpleDateFormat
        import java.util.Calendar
        import java.util.Date
        import java.util.Locale

        class GlanceWidgetProvider : AppWidgetProvider() {
            
            override fun onReceive(context: Context, intent: Intent) {
                super.onReceive(context, intent)
                val appWidgetManager = AppWidgetManager.getInstance(context)
                val widgetId = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID)
                
                if (intent.action == "com.alex.pixelglancewidget.TOGGLE_VIEW" && widgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                    val prefs = context.getSharedPreferences("widget_prefs", Context.MODE_PRIVATE)
                    val currentMode = prefs.getInt("view_mode_$widgetId", 0)
                    val newMode = if (currentMode == 0) 1 else 0
                    prefs.edit().putInt("view_mode_$widgetId", newMode).apply()
                    onUpdate(context, appWidgetManager, intArrayOf(widgetId))
                } else if (intent.action == "com.alex.pixelglancewidget.FORCE_REFRESH") {
                    val ids = intent.getIntArrayExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS)
                    if (ids != null) onUpdate(context, appWidgetManager, ids)
                }
            }

            override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                val prefs = context.getSharedPreferences("widget_prefs", Context.MODE_PRIVATE)

                for (appWidgetId in appWidgetIds) {
                    val views = RemoteViews(context.packageName, R.layout.widget_layout)
                    val viewMode = prefs.getInt("view_mode_$appWidgetId", 0)

                    when (prefs.getInt("bg_choice_$appWidgetId", 0)) {
                        0 -> views.setInt(R.id.widget_container, "setBackgroundResource", R.drawable.bg_dark_glass)
                        1 -> views.setInt(R.id.widget_container, "setBackgroundColor", android.graphics.Color.TRANSPARENT)
                        2 -> views.setInt(R.id.widget_container, "setBackgroundResource", R.drawable.bg_dynamic)
                    }

                    val toggleIntent = Intent(context, GlanceWidgetProvider::class.java).apply {
                        action = "com.alex.pixelglancewidget.TOGGLE_VIEW"
                        putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId)
                    }
                    val pendingToggle = PendingIntent.getBroadcast(context, appWidgetId + 4000, toggleIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                    views.setOnClickPendingIntent(R.id.btn_toggle, pendingToggle)

                    val refreshIntent = Intent(context, GlanceWidgetProvider::class.java).apply {
                        action = "com.alex.pixelglancewidget.FORCE_REFRESH"
                        putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, intArrayOf(appWidgetId))
                    }
                    val pendingRefresh = PendingIntent.getBroadcast(context, appWidgetId + 1000, refreshIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                    views.setOnClickPendingIntent(R.id.btn_refresh, pendingRefresh)

                    val configIntent = Intent(context, WidgetConfigActivity::class.java).apply {
                        putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId)
                        flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                    }
                    val pendingConfig = PendingIntent.getActivity(context, appWidgetId + 2000, configIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                    views.setOnClickPendingIntent(R.id.btn_settings, pendingConfig)

                    val calIntent = Intent(Intent.ACTION_VIEW).apply {
                        data = Uri.parse("content://com.android.calendar/time/")
                        flags = Intent.FLAG_ACTIVITY_NEW_TASK
                    }
                    val pendingCal = PendingIntent.getActivity(context, appWidgetId, calIntent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                    views.setOnClickPendingIntent(R.id.widget_event, pendingCal)

                    val weatherIntent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=el+tiempo")).apply {
                        flags = Intent.FLAG_ACTIVITY_NEW_TASK
                    }
                    val pendingWeather = PendingIntent.getActivity(context, appWidgetId + 3000, weatherIntent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                    views.setOnClickPendingIntent(R.id.widget_weather_main, pendingWeather)
                    views.setOnClickPendingIntent(R.id.widget_weather_sub, pendingWeather)

                    if (viewMode == 1) {
                        views.setViewVisibility(R.id.widget_weather_main, View.GONE)
                        views.setViewVisibility(R.id.widget_weather_sub, View.GONE)
                        views.setTextViewText(R.id.widget_title, "Agenda del Día:")
                        views.setTextViewText(R.id.btn_toggle, "⬅️")
                    } else {
                        views.setViewVisibility(R.id.widget_weather_main, View.VISIBLE)
                        views.setViewVisibility(R.id.widget_weather_sub, View.VISIBLE)
                        views.setTextViewText(R.id.widget_title, "Próximos Eventos (2h):")
                        views.setTextViewText(R.id.btn_toggle, "➡️")

                        Thread {
                            try {
                                var lat = 42.8782
                                var lon = -8.5448
                                var locality = prefs.getString("cached_locality", "Santiago") ?: "Santiago"

                                val hasCoarse = context.checkSelfPermission(android.Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                                val hasFine = context.checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED

                                if (hasCoarse || hasFine) {
                                    val locManager = context.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                                    val loc = locManager.getLastKnownLocation(LocationManager.GPS_PROVIDER)
                                        ?: locManager.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
                                        ?: locManager.getLastKnownLocation(LocationManager.PASSIVE_PROVIDER)

                                    if (loc != null) {
                                        lat = loc.latitude
                                        lon = loc.longitude
                                        try {
                                            val geocoder = Geocoder(context, Locale.getDefault())
                                            val addresses = geocoder.getFromLocation(lat, lon, 1)
                                            if (!addresses.isNullOrEmpty()) {
                                                locality = addresses[0].locality ?: addresses[0].subAdminArea ?: locality
                                                prefs.edit().putString("cached_locality", locality).apply()
                                            }
                                        } catch (e: Exception) {}
                                    }
                                }

                                val url = URL("https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation&daily=sunrise,sunset&timezone=auto")
                                val conn = url.openConnection() as HttpURLConnection
                                conn.connectTimeout = 4000
                                conn.readTimeout = 4000
                                
                                val reader = BufferedReader(InputStreamReader(conn.inputStream))
                                val response = java.lang.StringBuilder()
                                var line: String? = reader.readLine()
                                while (line != null) {
                                    response.append(line)
                                    line = reader.readLine()
                                }
                                reader.close()
                                
                                val jsonObj = JSONObject(response.toString())
                                val currentObj = jsonObj.getJSONObject("current")
                                val tempVal = currentObj.getDouble("temperature_2m")
                                val weatherCode = currentObj.getInt("weather_code")
                                val windSpeed = currentObj.getDouble("wind_speed_10m")
                                val windDir = currentObj.getDouble("wind_direction_10m")
                                val windGusts = currentObj.optDouble("wind_gusts_10m", windSpeed)
                                val precipitation = currentObj.optDouble("precipitation", 0.0)

                                var isNight = false
                                try {
                                    val dailyObj = jsonObj.getJSONObject("daily")
                                    val sunriseArr = dailyObj.getJSONArray("sunrise")
                                    val sunsetArr = dailyObj.getJSONArray("sunset")
                                    if (sunriseArr.length() > 0 && sunsetArr.length() > 0) {
                                        val isoFormat = SimpleDateFormat("yyyy-MM-dd'T'HH:mm", Locale.US)
                                        val sunriseTime = isoFormat.parse(sunriseArr.getString(0))?.time ?: 0L
                                        val sunsetTime = isoFormat.parse(sunsetArr.getString(0))?.time ?: 0L
                                        val currentTime = System.currentTimeMillis()
                                        isNight = currentTime < sunriseTime || currentTime > sunsetTime
                                    }
                                } catch (e: Exception) {
                                    val currentHour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                                    isNight = currentHour < 7 || currentHour >= 20
                                }

                                val knownNewMoon = 1704974400000L
                                val msPerCycle = 2551442976L
                                val currentMs = System.currentTimeMillis()
                                var phasePercent = ((currentMs - knownNewMoon) % msPerCycle) / msPerCycle.toDouble()
                                if (phasePercent < 0) phasePercent += 1.0
                                
                                val phaseIndex = Math.round(phasePercent * 8).toInt() % 8
                                val moonPhaseIcon = when (phaseIndex) {
                                    0 -> "🌑"
                                    1 -> "🌒"
                                    2 -> "🌓"
                                    3 -> "🌔"
                                    4 -> "🌕"
                                    5 -> "🌖"
                                    6 -> "🌗"
                                    7 -> "🌘"
                                    else -> "🌑"
                                }

                                val weatherIcon = when (weatherCode) {
                                    0 -> if (isNight) "🌙" else "☀️"
                                    1, 2 -> if (isNight) "☁️" else "🌤️"
                                    3 -> "☁️"
                                    45, 48 -> "🌫️"
                                    51, 53, 55, 56, 57, 61, 63, 65, 66, 67 -> "🌧️"
                                    71, 73, 75, 77 -> "❄️"
                                    80, 81, 82 -> "🌦️"
                                    95, 96, 99 -> "⛈️"
                                    else -> if (isNight) "🌙" else "⛅"
                                }
                                
                                val windIcon = when (windDir) {
                                    in 337.5..360.0, in 0.0..22.5 -> "⬇️"
                                    in 22.5..67.5 -> "↙️"
                                    in 67.5..112.5 -> "⬅️"
                                    in 112.5..157.5 -> "↖️"
                                    in 157.5..202.5 -> "⬆️"
                                    in 202.5..247.5 -> "↗️"
                                    in 247.5..292.5 -> "➡️"
                                    in 292.5..337.5 -> "↘️"
                                    else -> ""
                                }
                                
                                var aqiText = ""
                                try {
                                    val aqiUrl = URL("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=$lat&longitude=$lon&current=european_aqi")
                                    val aqiConn = aqiUrl.openConnection() as HttpURLConnection
                                    aqiConn.connectTimeout = 3000
                                    val aqiReader = BufferedReader(InputStreamReader(aqiConn.inputStream))
                                    val aqiResp = java.lang.StringBuilder()
                                    var aqiLine: String? = aqiReader.readLine()
                                    while (aqiLine != null) {
                                        aqiResp.append(aqiLine)
                                        aqiLine = aqiReader.readLine()
                                    }
                                    aqiReader.close()

                                    val aqiJson = JSONObject(aqiResp.toString())
                                    val aqiVal = aqiJson.getJSONObject("current").getDouble("european_aqi").toInt()
                                    
                                    val aqiEmoji = when {
                                        aqiVal <= 20 -> "🟢"
                                        aqiVal <= 40 -> "🟡"
                                        aqiVal <= 60 -> "🟠"
                                        aqiVal <= 80 -> "🔴"
                                        aqiVal <= 100 -> "🟣"
                                        else -> "🟤"
                                    }
                                    aqiText = "AQI: $aqiEmoji ($aqiVal)"
                                } catch (e: Exception) {}

                                // ==========================================
                                // MOTOR DE COLA DE PRIORIDADES v3.5
                                // ==========================================
                                val displayQueue = mutableListOf<String>()
                                var hasWindAlert = false

                                // 1. Tormentas Eléctricas
                                if (weatherCode in listOf(95, 96, 99)) {
                                    displayQueue.add("<font color='#FF4C4C'>⚡ Tormenta</font>")
                                }

                                // 2. Rachas de Viento (Meteogalicia: 70 / 90 / 130 km/h)
                                if (windGusts >= 130.0) {
                                    displayQueue.add("<font color='#FF4C4C'>💨 Rachas ${windGusts.toInt()}km/h</font>")
                                    hasWindAlert = true
                                } else if (windGusts >= 90.0) {
                                    displayQueue.add("<font color='#FFA500'>💨 Rachas ${windGusts.toInt()}km/h</font>")
                                    hasWindAlert = true
                                } else if (windGusts >= 70.0) {
                                    displayQueue.add("<font color='#FFD700'>💨 Rachas ${windGusts.toInt()}km/h</font>")
                                    hasWindAlert = true
                                }

                                // 3. Precipitación Horaria (Meteogalicia vs Informativa)
                                if (precipitation >= 60.0) {
                                    displayQueue.add("<font color='#FF4C4C'>🌧️ $precipitation l/m²</font>")
                                } else if (precipitation >= 30.0) {
                                    displayQueue.add("<font color='#FFA500'>🌧️ $precipitation l/m²</font>")
                                } else if (precipitation >= 15.0) {
                                    displayQueue.add("<font color='#FFD700'>🌧️ $precipitation l/m²</font>")
                                } else if (precipitation >= 0.1) {
                                    displayQueue.add("🌧️ $precipitation l/m²")
                                }

                                // 4. Nieve
                                if (weatherCode in listOf(71, 73, 75, 77)) {
                                    displayQueue.add("<font color='#FFD700'>❄️ Nieve</font>")
                                }

                                // 5. Elementos Estándar
                                if (!hasWindAlert) {
                                    val defaultWindStr = "$windIcon ${windSpeed.toInt()}km/h"
                                    displayQueue.add(defaultWindStr)
                                }
                                
                                if (aqiText.isNotEmpty()) displayQueue.add(aqiText)
                                
                                // Formato completo original mantenido
                                displayQueue.add("Luna: $moonPhaseIcon")

                                val finalSubList = displayQueue.take(4)
                                val subWeatherStr = finalSubList.joinToString(" &nbsp;•&nbsp; ")

                                val mainWeatherStr = "$weatherIcon $locality • ${tempVal}°C"

                                prefs.edit()
                                    .putString("cached_weather_main_$appWidgetId", mainWeatherStr)
                                    .putString("cached_weather_sub_$appWidgetId", subWeatherStr)
                                    .apply()

                                views.setTextViewText(R.id.widget_weather_main, mainWeatherStr)
                                views.setTextViewText(R.id.widget_weather_sub, Html.fromHtml(subWeatherStr, Html.FROM_HTML_MODE_COMPACT))
                                appWidgetManager.updateAppWidget(appWidgetId, views)
                            } catch (e: Exception) {
                                val cachedMain = prefs.getString("cached_weather_main_$appWidgetId", "🌙 Santiago • Clima guardado")
                                val cachedSub = prefs.getString("cached_weather_sub_$appWidgetId", "⬇️ • AQI: N/D")
                                views.setTextViewText(R.id.widget_weather_main, cachedMain ?: "🌙 Clima no disponible")
                                views.setTextViewText(R.id.widget_weather_sub, Html.fromHtml(cachedSub ?: "⬇️", Html.FROM_HTML_MODE_COMPACT))
                                appWidgetManager.updateAppWidget(appWidgetId, views)
                            }
                        }.start()
                    }

                    if (context.checkSelfPermission(android.Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                        views.setTextViewText(R.id.widget_event, "Requiere permiso de calendario")
                        appWidgetManager.updateAppWidget(appWidgetId, views)
                        continue
                    }

                    val now = System.currentTimeMillis()
                    val endTime = if (viewMode == 1) {
                        Calendar.getInstance().apply {
                            set(Calendar.HOUR_OF_DAY, 23)
                            set(Calendar.MINUTE, 59)
                            set(Calendar.SECOND, 59)
                        }.timeInMillis
                    } else {
                        now + (2 * 60 * 60 * 1000)
                    }

                    val builder = CalendarContract.Instances.CONTENT_URI.buildUpon()
                    ContentUris.appendId(builder, now)
                    ContentUris.appendId(builder, endTime)

                    val projection = arrayOf(
                        CalendarContract.Instances.TITLE, 
                        CalendarContract.Instances.BEGIN,
                        CalendarContract.Instances.END,
                        CalendarContract.Instances.ALL_DAY
                    )
                    val sortOrder = "${CalendarContract.Instances.BEGIN} ASC"
                    val htmlText = java.lang.StringBuilder()
                    val seenEvents = mutableSetOf<String>()

                    context.contentResolver.query(
                        builder.build(), projection, null, null, sortOrder
                    )?.use { cursor ->
                        var hasEvents = false
                        var eventCount = 0
                        while (cursor.moveToNext()) {
                            val titleStr = cursor.getString(0) ?: "Evento"
                            val begin = cursor.getLong(1)
                            val end = cursor.getLong(2)
                            val isAllDay = cursor.getInt(3) == 1

                            if (isAllDay) {
                                val evCal = Calendar.getInstance().apply { timeInMillis = begin }
                                val nowCal = Calendar.getInstance()
                                if (evCal.get(Calendar.DAY_OF_YEAR) != nowCal.get(Calendar.DAY_OF_YEAR) && begin > now) {
                                    continue
                                }
                            }

                            if (viewMode == 0 && end <= now) {
                                continue
                            }
                            
                            if (seenEvents.contains(titleStr)) continue
                            seenEvents.add(titleStr)
                            
                            hasEvents = true
                            eventCount++

                            if (eventCount > 4) {
                                val overflowMsg = if (viewMode == 1) "... y más eventos hoy" else "... y más eventos próximos"
                                htmlText.append("<font color='#AAAAAA'>$overflowMsg</font>")
                                break
                            }
                            
                            var minutesLeft = ((begin - now) / 60000).toInt()
                            if (minutesLeft < 0) minutesLeft = 0
                            
                            var flair = "📅"
                            val lowerTitle = titleStr.lowercase()
                            when {
                                lowerTitle.contains("dentist") -> flair = "🦷"
                                lowerTitle.contains("médic") || lowerTitle.contains("medic") || lowerTitle.contains("hospital") || lowerTitle.contains("consulta") || lowerTitle.contains("sergas") -> flair = "⚕️"
                                lowerTitle.contains("baloncesto") || lowerTitle.contains("basket") || lowerTitle.contains("obradoiro") -> flair = "🏀"
                                lowerTitle.contains("tenis") || lowerTitle.contains("pádel") || lowerTitle.contains("padel") -> flair = "🎾"
                                lowerTitle.contains("fútbol") || lowerTitle.contains("futbol") || lowerTitle.contains("futsal") -> flair = "⚽"
                                lowerTitle.contains("piscina") || lowerTitle.contains("natación") || lowerTitle.contains("natacion") || lowerTitle.contains("swolf") -> flair = "🏊"
                                lowerTitle.contains("vuel") || lowerTitle.contains("avión") || lowerTitle.contains("avion") || lowerTitle.contains("flight") -> flair = "✈️"
                                lowerTitle.contains("tren") || lowerTitle.contains("renfe") || lowerTitle.contains("ave") || lowerTitle.contains("alvia") -> flair = "🚆"
                                lowerTitle.contains("hotel") || lowerTitle.contains("reserva") || lowerTitle.contains("b&b") -> flair = "🏨"
                                lowerTitle.contains("comida") || lowerTitle.contains("cena") || lowerTitle.contains("restaurante") -> flair = "🍽️"
                            }

                            val timeText = if (isAllDay) {
                                "Todo el día"
                            } else {
                                if (viewMode == 1) {
                                    val evCal = Calendar.getInstance().apply { timeInMillis = begin }
                                    String.format(Locale.getDefault(), "%02d:%02d", evCal.get(Calendar.HOUR_OF_DAY), evCal.get(Calendar.MINUTE))
                                } else {
                                    when {
                                        minutesLeft <= 0 -> "Ahora"
                                        minutesLeft <= 60 -> "$minutesLeft min"
                                        minutesLeft <= 90 -> "Menos de 1h y media"
                                        else -> "Menos de 2 horas"
                                    }
                                }
                            }

                            val hexColor = if (isAllDay) {
                                "#4CFF4C"
                            } else {
                                when {
                                    minutesLeft <= 15 -> "#FF4C4C"
                                    minutesLeft <= 60 -> "#FFA500"
                                    else -> "#4CFF4C"
                                }
                            }

                            htmlText.append("<font color='$hexColor'>$flair $titleStr &nbsp;•&nbsp; $timeText</font><br>")
                        }
                        
                        if (!hasEvents) {
                            val msg = if (viewMode == 1) "Sin eventos para hoy" else "Sin eventos en las próximas 2 horas"
                            htmlText.append("<font color='#AAAAAA'>$msg</font>")
                        }
                    } ?: run {
                        htmlText.append("<font color='#AAAAAA'>Error leyendo calendario</font>")
                    }

                    views.setTextViewText(R.id.widget_event, Html.fromHtml(htmlText.toString(), Html.FROM_HTML_MODE_COMPACT))
                    appWidgetManager.updateAppWidget(appWidgetId, views)
                }
                scheduleNextUpdate(context, appWidgetIds)
            }

            private fun scheduleNextUpdate(context: Context, appWidgetIds: IntArray) {
                val intent = Intent(context, GlanceWidgetProvider::class.java).apply {
                    action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                    putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, appWidgetIds)
                }
                val pendingIntent = PendingIntent.getBroadcast(context, 123, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                
                val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                val calendar = Calendar.getInstance().apply {
                    add(Calendar.MINUTE, 1)
                    set(Calendar.SECOND, 0)
                    set(Calendar.MILLISECOND, 0)
                }
                alarmManager.setExact(AlarmManager.RTC, calendar.timeInMillis, pendingIntent)
            }
        }
        EOF

    - name: Compilar APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: DeUnVistazoXL-v3.5-APK
        path: app/build/outputs/apk/debug/app-debug.apk
